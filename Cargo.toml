[package]
name = "frontbridge"
version = "0.1.0"
edition = "2024"

[features]
test-hook = []

[dependencies]
anyhow = "1.0"
log = "0.4"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }

# 应用实际跑的 Tauri 运行时由本 crate 的 `runtime` 模块统一选择：
# Linux 走 CEF（Chromium），其余平台继续走 wry（系统 WebView）。
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2.11.3", default-features = false, features = ["wry"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { path = "../../vendor/tauri-runtime-cef" }
